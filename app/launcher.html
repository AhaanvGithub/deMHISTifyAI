<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body class="launcher">
  <form id="f" class="bar">
    <span class="logo">de<b>MHIST</b>ify</span>
    <input id="q" autofocus spellcheck="false" placeholder="What do you think it is?  e.g. “sessile serrated lesion, 70%”">
    <kbd>⏎ then snip</kbd>
  </form>
<script>
  const q = document.getElementById('q'), bar = document.getElementById('f');
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    bar.classList.add('leaving');  // pill shrinks away, then the snip opens
    setTimeout(() => { window.demhist.submit(text); q.value = ''; bar.classList.remove('leaving'); bar.classList.add('away'); }, 170);
  });
  // The page loads hidden at start-up, so its entrance animation would finish unseen. Park the pill while the
  // window is hidden and replay the entrance each time the hotkey shows it.
  bar.classList.add('away');
  window.addEventListener('blur', () => bar.classList.add('away'));
  window.demhist.onFocus(() => { bar.classList.remove('away'); q.focus(); });
  window.demhist.onWarm(() => { bar.classList.remove('away'); setTimeout(() => bar.classList.add('away'), 450); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { bar.classList.add('away'); window.close?.(); } });
</script>
</body>
</html>
