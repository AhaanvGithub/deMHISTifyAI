<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body class="launcher">
  <form id="f" class="bar">
    <span class="logo">de<b>MHIST</b>ify</span>
    <input id="q" autofocus spellcheck="false" placeholder="What do you think it is?  e.g. “sessile serrated lesion, 70%”">
    <kbd>⏎ then snip</kbd>
  </form>
<script>
  const q = document.getElementById('q'), bar = document.getElementById('f');
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    bar.classList.add('leaving');  // pill shrinks away, then the snip opens
    setTimeout(() => { window.demhist.submit(text); q.value = ''; bar.classList.remove('leaving'); }, 170);
  });
  window.demhist.onFocus(() => q.focus());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close?.(); });
</script>
</body>
</html>
