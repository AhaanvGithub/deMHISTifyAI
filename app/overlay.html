<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cutoff.css">
</head>
<body class="overlay">
  <canvas id="shot"></canvas>
  <canvas id="dim"></canvas>

  <div id="chip" class="chip"></div>
  <div id="hint" class="hint">Drag to select the slide region · <kbd>Esc</kbd> to cancel</div>
  <div id="sizeTag" class="size-tag hidden"></div>

  <!-- tissue box + heatmap live inside the selection -->
  <div id="sel" class="sel hidden">
    <div id="tissue" class="tissue hidden">
      <canvas id="heat"></canvas>
      <canvas id="feat"></canvas>
      <div id="colorbar" class="colorbar hidden"><div class="cb-grad"></div><div class="cb-ticks"><span id="cbTop">1.0 SSL</span><span id="cbMid">0.5</span><span id="cbBottom">0 HP</span></div><div id="cbLabel" class="cb-label">P(SSL)</div></div>
      <div id="colLabels" class="axis cols"></div>
      <div id="rowLabels" class="axis rows"></div>
      <span class="handle nw"></span><span class="handle ne"></span><span class="handle sw"></span><span class="handle se"></span>
      <div id="tissueTag" class="tissue-tag">detecting tissue…</div>
    </div>
  </div>

  <div id="actions" class="actions hidden">
    <button id="analyzeBtn" class="primary">Analyze <kbd>⏎</kbd></button>
    <button id="resetBtn">Reselect</button>
  </div>

  <div id="heatControls" class="heat-controls hidden">
    <div class="seg">
      <button data-ref="ai" class="on">AI's call</button>
      <button data-ref="researcher">Your call</button>
    </div>
    <label>Opacity <input id="opacity" type="range" min="0" max="100" value="45"></label>
    <label class="chk"><input id="showGrid" type="checkbox" checked> Grid</label>
    <label class="chk"><input id="showFeat" type="checkbox" checked> Crypts</label>
    <span class="legend" title="Measured on the image; thresholds set on MHIST training images"><span><i style="background:#ffc857"></i>dilated</span><span><i style="background:#c79bff"></i>serrated</span><span><i style="background:#5eead4"></i>round regular</span></span>
  </div>

  <aside id="panel" class="panel hidden">
   <div id="panelInner" class="panel-inner">
    <header>
      <span class="logo">de<b>MHIST</b>ify</span>
      <span class="hdr-right"><span class="scope">Validated for: colon serrated polyps</span><button id="gear" class="gear" title="Decision cut-off">⚙</button></span>
    </header>

    <section id="youCard" class="card"></section>

    <section class="card">
      <h3>Image judges <small id="judgesNote"></small></h3>
      <div id="panelSummary" class="summary muted">waiting…</div>
      <div id="judges" class="judges"></div>
      <div id="cutHint" class="cut-hint"></div>
    </section>

    <section id="litCard" class="card pending">
      <h3>Literature judge <small id="judgeModel">Lumen</small></h3>
      <div id="litSummary" class="summary muted"><span class="spinner"></span> reading the papers…</div>
      <div id="litBody"></div>
    </section>

    <section id="flagsCard" class="card flags hidden"></section>

    <section id="verdictCard" class="card verdict pending">
      <h3>Verdict</h3>
      <div id="verdict" class="muted"><span class="spinner"></span> weighing everything…</div>
    </section>

    <footer>Research tool, not for diagnosis.</footer>
   </div>
  </aside>

<script src="cutoff_data.js"></script>
<script src="cutoff.js"></script>
<script src="overlay.js"></script>
</body>
</html>
